# Builds standalone Go and Rust binaries for each platform and attaches them
# to a GitHub Release when a version tag (v*) is pushed. Can also be run
# manually from the Actions tab to just build (artifacts, no release).

name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          go build -trimpath -ldflags="-s -w" \
            -o dist/pictdiff-go-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} pictdiff.go
      - name: Smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./.github/smoke-test.sh dist/pictdiff-go-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: pictdiff-go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  rust:
    name: Rust ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,     target: x86_64-unknown-linux-musl,  test: true }
          - { os: ubuntu-24.04-arm,  target: aarch64-unknown-linux-musl, test: true }
          - { os: macos-latest,      target: aarch64-apple-darwin,       test: true }
          - { os: macos-latest,      target: x86_64-apple-darwin,        test: false }
          - { os: windows-latest,    target: x86_64-pc-windows-msvc,     test: true, ext: .exe }
    steps:
      - uses: actions/checkout@v5
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}
          mkdir dist
          cp target/${{ matrix.target }}/release/pictdiff${{ matrix.ext }} \
            dist/pictdiff-rs-${{ matrix.target }}${{ matrix.ext }}
      - name: Smoke test
        if: matrix.test
        shell: bash
        run: ./.github/smoke-test.sh dist/pictdiff-rs-${{ matrix.target }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: pictdiff-rs-${{ matrix.target }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [go, rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          chmod +x pictdiff-*
          sha256sum pictdiff-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" pictdiff-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
